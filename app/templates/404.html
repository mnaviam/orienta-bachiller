{% extends "base.html" %}

{% block title %}Página No Encontrada | OrientaBachiller{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 text-center space-y-6">
    <div class="w-20 h-20 rounded-3xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-3xl font-bold mx-auto">
        <i class="fa-solid fa-compass"></i>
    </div>

    <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight">404 - Página No Encontrada</h1>
    
    <p class="text-slate-600 text-sm leading-relaxed">
        {{ message or 'La página o recurso que buscas no existe o ha sido movido. Utiliza el menú superior para navegar.' }}
    </p>

    <div class="pt-4">
        <a href="{{ url_for('main.home') }}" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-slate-900 hover:bg-brand-600 text-white font-bold text-xs shadow-sm transition-all">
            <i class="fa-solid fa-house"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
